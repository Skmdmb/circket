<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sunday League Live</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
        }

        .no-scrollbar::-webkit-scrollbar{
            display:none;
        }

    </style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

    <!-- HEADER -->

    <div class="flex justify-between items-center mb-5">

        <h1 class="text-2xl font-black text-yellow-400">
            Sunday League Live
        </h1>

        <button onclick="toggleAdmin()"
            id="adminBtn"
            class="bg-yellow-500 text-black px-4 py-2 rounded-xl font-black">
            ADMIN
        </button>

    </div>
<!-- SCOREBOARD -->

    <div id="mainDashboard"
        class="bg-slate-800 p-5 rounded-3xl border border-slate-700 mb-5">

        <div class="text-center">

            <p id="batTeamDisp"
                class="text-yellow-400 font-black uppercase text-sm">
                TEAM
            </p>

            <h1 id="dispScore"
                class="text-6xl font-black mt-2">
                0/0
            </h1>

            <p class="text-slate-400 mt-2">
                Overs :
                <span id="dispOvers">0.0</span>
                /
                <span id="limitOvers">5</span>
            </p>

        </div>

        <!-- TARGET -->

        <div id="targetBox"
            class="hidden mt-4 bg-yellow-500 text-black p-3 rounded-2xl text-center font-black">

            Target :
            <span id="targetVal">0</span>

        </div>

    </div>


    <!-- PLAYER HUD -->

    <div class="grid grid-cols-2 gap-3 mb-6">

        <div class="bg-slate-800 p-4 rounded-3xl border-l-4 border-blue-500">

            <p class="text-[8px] text-blue-400 font-black uppercase">
                Striker
            </p>

            <p id="dispSName"
                class="font-bold text-sm">
                ---
            </p>

            <p id="dispSStats"
                class="text-xl font-black">
                0(0)
            </p>

        </div>

        <div class="bg-slate-800 p-4 rounded-3xl border-l-4 border-slate-600">

            <p class="text-[8px] text-slate-400 font-black uppercase">
                Non Striker
            </p>

            <p id="dispNSName"
                class="font-bold text-sm">
                ---
            </p>

            <p id="dispNSStats"
                class="text-xl font-black">
                0(0)
            </p>

        </div>

        <div class="col-span-2 bg-slate-800 p-4 rounded-3xl border-l-4 border-red-500">

            <p class="text-[8px] text-red-400 font-black uppercase">
                Bowler
            </p>

            <p id="dispBName"
                class="font-bold text-lg">
                ---
            </p>

            <p id="dispBStats"
                class="text-xl font-black">
                0-0 (0.0)
            </p>

        </div>

    </div>
<!-- SCORER PANEL -->

    <div id="scorerPanel"
        class="space-y-4">

        <!-- BUTTON GRID -->

        <div id="btnGrid"
            class="grid grid-cols-4 gap-2">

            <button onclick="handleRun(0)"
                class="bg-slate-700 h-14 rounded-xl font-black">
                0
            </button>

            <button onclick="handleRun(1)"
                class="bg-slate-700 h-14 rounded-xl font-black">
                1
            </button>

            <button onclick="handleRun(2)"
                class="bg-slate-700 h-14 rounded-xl font-black">
                2
            </button>

            <button onclick="handleRun(3)"
                class="bg-slate-700 h-14 rounded-xl font-black">
                3
            </button>

            <button onclick="handleRun(4)"
                class="bg-blue-600 h-14 rounded-xl font-black">
                4
            </button>

            <button onclick="handleRun(6)"
                class="bg-green-600 h-14 rounded-xl font-black">
                6
            </button>

            <button onclick="wideBall()"
                class="bg-orange-600 h-14 rounded-xl font-black">
                WD
            </button>

            <button onclick="noBall()"
                class="bg-purple-600 h-14 rounded-xl font-black">
                NB
            </button>

            <button onclick="handleWicket()"
                class="bg-red-600 h-14 rounded-xl font-black">
                WKT
            </button>

            <button onclick="undo()"
                class="bg-slate-600 h-14 rounded-xl font-black">
                UNDO
            </button>

        </div>


        <!-- PLAYER INPUT -->

        <div class="flex gap-2">

            <input id="newP"
                type="text"
                placeholder="Player Name"
                class="flex-1 bg-slate-800 p-4 rounded-2xl border border-slate-700 outline-none">

            <button onclick="addP()"
                class="bg-yellow-500 text-black px-5 rounded-2xl font-black">
                +
            </button>

        </div>

        <!-- PLAYER LIST -->

        <div id="adminPList"
            class="space-y-2 max-h-56 overflow-y-auto no-scrollbar">
        </div>

    </div>


    <!-- STATS -->

    <div id="statsContent"
        class="mt-6">
    </div>
<script>

const ADMIN_PASS = "college123";

let history = [];

let state = {

    maxOvers : 5,

    runs : 0,
    wickers : 0,
    balls : 0,

    players : [],

    sIdx : null,
    nsIdx : null,
    bIdx : null,

    batTeam : "Team A",
    bowlTeam : "Team B",
    curBat : "Team A",

    curInn : 1,

    target : null,

    isOverWaiting : false

};


// ===== ADMIN =====

function toggleAdmin(){

    if(prompt("Enter Admin Password") === ADMIN_PASS){

        document.getElementById("scorerPanel")
            .classList.toggle("hidden");
    }
}


// ===== ADD PLAYER =====

function addP(){

    let n = document.getElementById("newP").value;

    if(!n) return;

    state.players.push({

        name : n,
        team : state.curBat,

        r : 0,
        b : 0,

        w : 0,
        rc : 0,
        bb : 0,

        isOut : false
    });

    document.getElementById("newP").value = "";

    render();
}


// ===== RUN =====

function handleRun(r){

    if(state.sIdx === null ||
       state.nsIdx === null ||
       state.bIdx === null){

        return alert("Select striker/non striker/bowler");
    }

    saveUndo();

    state.runs += r;

    state.balls++;

    state.players[state.sIdx].r += r;
    state.players[state.sIdx].b++;

    state.players[state.bIdx].rc += r;
    state.players[state.bIdx].bb++;

    if(r % 2 !== 0){
        swap();
    }

    if(state.balls % 6 === 0){

        state.isOverWaiting = true;

        swap();
    }

    render();
}


// ===== WIDE =====

function wideBall(){

    saveUndo();

    state.runs += 1;

    state.players[state.bIdx].rc += 1;

    let extra = prompt("Extra runs on wide","0");

    extra = parseInt(extra) || 0;

    state.runs += extra;

    state.players[state.bIdx].rc += extra;

    if(extra % 2 !== 0){
        swap();
    }

    let out = confirm("Run out on wide?");

    if(out){

        state.wickers++;

        state.players[state.bIdx].w++;

        state.players[state.sIdx].isOut = true;

        state.sIdx = null;
    }

    render();
}


// ===== NO BALL =====

function noBall(){

    saveUndo();

    state.runs += 1;

    state.players[state.bIdx].rc += 1;

    let batRuns = prompt("Runs from bat","0");

    batRuns = parseInt(batRuns) || 0;

    state.runs += batRuns;

    state.players[state.sIdx].r += batRuns;

    state.players[state.bIdx].rc += batRuns;

    if(batRuns % 2 !== 0){
        swap();
    }

    let out = confirm("Run out on no ball?");

    if(out){

        state.wickers++;

        state.players[state.bIdx].w++;

        state.players[state.sIdx].isOut = true;

        state.sIdx = null;
    }

    render();
}


// ===== WICKET =====

function handleWicket(){

    saveUndo();

    state.wickers++;

    state.balls++;

    state.players[state.sIdx].b++;

    state.players[state.sIdx].isOut = true;

    state.players[state.bIdx].w++;

    state.players[state.bIdx].bb++;

    state.sIdx = null;

    if(state.balls % 6 === 0){

        state.isOverWaiting = true;

        swap();
    }

    render();
}


// ===== RENDER =====

function render(){

    document.getElementById("dispScore")
        .innerText =
        state.runs + "/" + state.wickers;

    document.getElementById("dispOvers")
        .innerText =
        Math.floor(state.balls/6)
        + "."
        + (state.balls%6);

    updateHUD(
        "dispSName",
        "dispSStats",
        state.sIdx
    );

    updateHUD(
        "dispNSName",
        "dispNSStats",
        state.nsIdx
    );

    if(state.bIdx !== null){

        let b = state.players[state.bIdx];

        document.getElementById("dispBName")
            .innerText = b.name;

        document.getElementById("dispBStats")
            .innerText =
            b.rc + "-" +
            b.w +
            " (" +
            Math.floor(b.bb/6)
            + "." +
            (b.bb%6)
            + ")";
    }

    renderAdminList();
}


// ===== PLAYER LIST =====

function renderAdminList(){

    let list =
        document.getElementById("adminPList");

    list.innerHTML = "";

    state.players.forEach((p,i)=>{

        list.innerHTML += `

        <div class="bg-slate-800 p-3 rounded-2xl flex justify-between items-center">

            <span class="font-bold text-sm">
                ${p.name}
            </span>

            <div class="flex gap-1">

                <button onclick="setField(${i},'S')"
                    class="bg-blue-700 px-2 py-1 rounded text-[10px]">
                    STR
                </button>

                <button onclick="setField(${i},'NS')"
                    class="bg-slate-600 px-2 py-1 rounded text-[10px]">
                    NON
                </button>

                <button onclick="setField(${i},'B')"
                    class="bg-red-700 px-2 py-1 rounded text-[10px]">
                    BOWL
                </button>

            </div>

        </div>
        `;
    });
}


// ===== SET PLAYER =====

function setField(i,r){

    if(r==="S") state.sIdx=i;

    if(r==="NS") state.nsIdx=i;

    if(r==="B") state.bIdx=i;

    render();
}


// ===== HUD =====

function updateHUD(idN,idS,idx){

    if(idx !== null){

        let p = state.players[idx];

        document.getElementById(idN)
            .innerText = p.name;

        document.getElementById(idS)
            .innerText =
            p.r + "(" + p.b + ")";
    }
}


// ===== SWAP =====

function swap(){

    let t = state.sIdx;

    state.sIdx = state.nsIdx;

    state.nsIdx = t;
}


// ===== UNDO =====

function saveUndo(){

    history.push(JSON.stringify(state));
}

function undo(){

    if(history.length > 0){

        state = JSON.parse(history.pop());

        render();
    }
}


render();

</script>

</body>
</html>
