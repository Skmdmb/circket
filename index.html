<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sunday League Live</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#08122e;
    color:white;
    font-family:Arial;
}

.no-scrollbar::-webkit-scrollbar{
    display:none;
}

</style>

</head>

<body>

<div class="max-w-md mx-auto p-4">

<div class="flex justify-between items-center mb-5">

    <h1 class="text-2xl font-black text-yellow-400">
        Sunday League Live
    </h1>

    <button
        id="adminBtn"

        onclick="toggleAdmin()"

        class="bg-yellow-500 text-black px-4 py-3 rounded-2xl font-black">

        ADMIN

    </button>

</div>

<div
class="bg-slate-800 p-6 rounded-[2rem] border border-slate-700 mb-5">

    <div class="text-center">

        <p
        class="text-yellow-400 font-black uppercase text-sm">

            LIVE MATCH

        </p>

        <h1
        id="score"

        class="text-6xl font-black mt-2">

            0/0

        </h1>

        <p
        class="text-slate-400 text-lg mt-2">

            Overs :
            <span id="overs">0.0</span>

        </p>

    </div>

</div>

<div class="grid grid-cols-2 gap-3 mb-4">

    <!-- STRIKER -->

    <div
    class="bg-slate-800 p-4 rounded-[2rem] border-l-4 border-blue-500">

        <p
        class="text-[10px] text-blue-400 font-black uppercase">

            Striker

        </p>

        <p
        id="sName"

        class="font-bold text-lg mt-2">

            ---

        </p>

        <p
        id="sStats"

        class="text-3xl font-black">

            0(0)

        </p>

    </div>


    <!-- NON STRIKER -->

    <div
    class="bg-slate-800 p-4 rounded-[2rem] border-l-4 border-slate-500">

        <p
        class="text-[10px] text-slate-400 font-black uppercase">

            Non Striker

        </p>

        <p
        id="nsName"

        class="font-bold text-lg mt-2">

            ---

        </p>

        <p
        id="nsStats"

        class="text-3xl font-black">

            0(0)

        </p>

    </div>

</div>


<!-- BOWLER -->

<div
class="bg-slate-800 p-4 rounded-[2rem] border-l-4 border-red-500 mb-5">

    <p
    class="text-[10px] text-red-400 font-black uppercase">

        Bowler

    </p>

    <p
    id="bName"

    class="font-bold text-lg mt-2">

        ---

    </p>

    <p
    id="bStats"

    class="text-3xl font-black">

        0-0 (0.0)

    </p>

</div>

<div
id="adminPanel"

class="hidden">


<!-- BUTTONS -->

<div
class="grid grid-cols-4 gap-2 mb-4">

<button
onclick="run(0)"
class="bg-slate-700 h-14 rounded-2xl font-black">
0
</button>

<button
onclick="run(1)"
class="bg-slate-700 h-14 rounded-2xl font-black">
1
</button>

<button
onclick="run(2)"
class="bg-slate-700 h-14 rounded-2xl font-black">
2
</button>

<button
onclick="run(3)"
class="bg-slate-700 h-14 rounded-2xl font-black">
3
</button>

<button
onclick="run(4)"
class="bg-blue-600 h-14 rounded-2xl font-black">
4
</button>

<button
onclick="run(6)"
class="bg-green-600 h-14 rounded-2xl font-black">
6
</button>

<button
onclick="wideBall()"
class="bg-orange-600 h-14 rounded-2xl font-black">
WD
</button>

<button
onclick="noBall()"
class="bg-purple-600 h-14 rounded-2xl font-black">
NB
</button>

<button
onclick="wicket()"
class="bg-red-600 h-14 rounded-2xl font-black">
WKT
</button>

<button
onclick="undo()"
class="bg-slate-500 h-14 rounded-2xl font-black">
UNDO
</button>

</div>


<!-- PLAYER INPUT -->

<div class="flex gap-2 mb-4">

<input
id="playerInput"

placeholder="Player Name"

class="flex-1 bg-slate-800 p-4 rounded-2xl border border-slate-700 outline-none">

<button
onclick="addPlayer()"

class="bg-yellow-500 text-black px-5 rounded-2xl font-black">

+

</button>

</div>


<!-- PLAYER LIST -->

<div
id="playerList"

class="space-y-2">
</div>

</div>

<script>

// ===== CLOUD =====

const BIN_ID = "4477da91ccb09a87c2ae";

const API_URL =
`https://api.npoint.io/${BIN_ID}`;



// ===== ADMIN =====

const PASSWORD = "college123";

let isAdmin = false;



// ===== STATE =====

let state = {

runs : 0,
wickets : 0,
balls : 0,

players : [],

striker : null,
nonStriker : null,
bowler : null

};

let history = [];



// ===== ADMIN LOGIN =====

function toggleAdmin(){

if(!isAdmin){

let pass =
prompt("Enter Password");

if(pass === PASSWORD){

isAdmin = true;

document
.getElementById("adminPanel")
.classList.remove("hidden");

document
.getElementById("adminBtn")
.innerText = "ADMIN ✓";

}
else{

alert("Wrong Password");

}

}
else{

isAdmin = false;

document
.getElementById("adminPanel")
.classList.add("hidden");

document
.getElementById("adminBtn")
.innerText = "ADMIN";

}

}



// ===== CLOUD SAVE =====

async function syncToCloud(){

if(!isAdmin) return;

try{

await fetch(API_URL,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(state)

});

}
catch(err){

console.log(err);

}

}



// ===== CLOUD LOAD =====

async function autoRefresh(){

if(isAdmin) return;

try{

const res =
await fetch(API_URL + "?t=" + Date.now());

const data =
await res.json();

if(data){

state = data;

render();

}

}
catch(err){

console.log(err);

}

}

setInterval(autoRefresh,1000);



// ===== PLAYER =====

function addPlayer(){

let name =
document.getElementById("playerInput").value;

if(!name) return;

state.players.push({

name : name,

runs : 0,
balls : 0,

wickets : 0,
conceded : 0,
overBalls : 0

});

document.getElementById("playerInput").value="";

render();

syncToCloud();

}



// ===== RUN =====

function run(r){

if(state.striker===null ||
state.nonStriker===null ||
state.bowler===null){

return alert("Assign players");
}

saveUndo();

state.runs += r;

state.balls++;

let s =
state.players[state.striker];

let b =
state.players[state.bowler];

s.runs += r;
s.balls++;

b.conceded += r;
b.overBalls++;

if(r%2===1){

swap();

}

if(state.balls%6===0){

swap();

}

render();

syncToCloud();

}



// ===== WIDE =====

function wideBall(){

saveUndo();

state.runs += 1;

state.players[state.bowler]
.conceded += 1;

render();

syncToCloud();

}



// ===== NO BALL =====

function noBall(){

saveUndo();

state.runs += 1;

state.players[state.bowler]
.conceded += 1;

render();

syncToCloud();

}



// ===== WICKET =====

function wicket(){

saveUndo();

state.wickets++;

state.balls++;

state.players[state.striker]
.balls++;

state.players[state.bowler]
.wickets++;

state.players[state.bowler]
.overBalls++;

render();

syncToCloud();

}



// ===== SWAP =====

function swap(){

let t =
state.striker;

state.striker =
state.nonStriker;

state.nonStriker = t;

}



// ===== RENDER =====

function render(){

document
.getElementById("score")
.innerText =
state.runs + "/" + state.wickets;

document
.getElementById("overs")
.innerText =
Math.floor(state.balls/6)
+ "."
+ (state.balls%6);



// striker
if(state.striker!==null){

let s =
state.players[state.striker];

document
.getElementById("sName")
.innerText = s.name;

document
.getElementById("sStats")
.innerText =
s.runs + "(" + s.balls + ")";

}



// non striker
if(state.nonStriker!==null){

let n =
state.players[state.nonStriker];

document
.getElementById("nsName")
.innerText = n.name;

document
.getElementById("nsStats")
.innerText =
n.runs + "(" + n.balls + ")";

}



// bowler
if(state.bowler!==null){

let b =
state.players[state.bowler];

document
.getElementById("bName")
.innerText = b.name;

document
.getElementById("bStats")
.innerText =

b.wickets
+ "-"
+ b.conceded

+ " ("

+ Math.floor(b.overBalls/6)

+ "."

+ (b.overBalls%6)

+ ")";

}

renderPlayers();

}



// ===== PLAYER LIST =====

function renderPlayers(){

let list =
document.getElementById("playerList");

list.innerHTML = "";

state.players.forEach((p,i)=>{

list.innerHTML += `

<div
class="bg-slate-800 p-3 rounded-2xl flex justify-between items-center">

<span class="font-bold">
${p.name}
</span>

<div class="flex gap-1">

<button
onclick="state.striker=${i};render();syncToCloud();"

class="bg-blue-700 px-2 py-1 rounded text-[10px]">

STR

</button>

<button
onclick="state.nonStriker=${i};render();syncToCloud();"

class="bg-slate-600 px-2 py-1 rounded text-[10px]">

NON

</button>

<button
onclick="state.bowler=${i};render();syncToCloud();"

class="bg-red-700 px-2 py-1 rounded text-[10px]">

BOWL

</button>

</div>

</div>

`;

});

}



// ===== UNDO =====

function saveUndo(){

history.push(
JSON.stringify(state)
);

}

function undo(){

if(history.length>0){

state =
JSON.parse(history.pop());

render();

syncToCloud();

}

}



// ===== START =====

autoRefresh();

render();

</script>

</body>
</html>
