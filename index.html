<script>

    // =========================
    // CONFIG
    // =========================

    const ADMIN_PASS = "college123";

    const BIN_ID = "3bf04df403317e6901ba";

    const API_URL = `https://api.npoint.io/${BIN_ID}`;


    // =========================
    // MAIN STATE
    // =========================

    let state = {

        // MATCH

        maxOvers: 5,

        runs: 0,

        wickers: 0,

        balls: 0,


        // PLAYERS

        players: [],

        sIdx: null,

        nsIdx: null,

        bIdx: null,


        // TEAMS

        batTeam: '',

        bowlTeam: '',

        curBat: '',

        curInn: 1,


        // TARGET

        target: null,


        // FLAGS

        isOverWaiting: false,

        matchEnded: false,


        // TOURNAMENT

        tournamentTeams: [],

        points: {},


        // NEW FEATURES

        overBalls: [],

        fallOfWickets: []
    };


    // =========================
    // OTHER VARIABLES
    // =========================

    let history = [];

    let activeAdminTeam = '';

    let isAdmin = false;

// =========================
    // CLOUD SYNC
    // =========================

    async function syncToCloud() {

        if(!isAdmin) return;

        try {

            await fetch(API_URL, {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(state)

            });

        } catch (e) {

            console.error("Sync Error");

        }
    }


    // =========================
    // AUTO REFRESH
    // =========================

    async function autoRefresh() {

        if(isAdmin) return;

        try {

            const res = await fetch(API_URL, {

                method: 'GET',

                cache: 'no-cache'

            });

            const data = await res.json();

            if(
                data &&
                data.tournamentTeams &&
                data.tournamentTeams.length > 0
            ) {

                state = data;

                render();
            }

        } catch(e) {

            console.log("Refresh Error");

        }
    }


    // AUTO REFRESH EVERY 3 SEC

    setInterval(autoRefresh, 3000);


    // ON LOAD

    window.onload = () => {

        autoRefresh();

    };

// =========================
    // ADMIN PANEL
    // =========================

    function toggleAdmin() {

        if(!isAdmin) {

            if(prompt("Admin PIN:") === ADMIN_PASS) {

                isAdmin = true;

                document.getElementById('adminBtn')
                    .innerText = "🔓 ADMIN";

                // FIRST TIME SETUP

                if(state.tournamentTeams.length === 0) {

                    document.getElementById('setupOverlay')
                        .classList.remove('hidden');

                }

                // NO MATCH

                else if(!state.batTeam) {

                    showMatchSelector();

                }

                // SHOW SCORER

                else {

                    document.getElementById('scorerPanel')
                        .classList.remove('hidden');
                }

            }

        } else {

            document.getElementById('scorerPanel')
                .classList.toggle('hidden');
        }
    }


    // =========================
    // GENERATE TEAM INPUTS
    // =========================

    function generateTeamInputs() {

        const num =
            document.getElementById('numTeams').value;

        const container =
            document.getElementById('teamNamesContainer');

        container.innerHTML = '';

        for(let i=1; i<=num; i++) {

            container.innerHTML += `

                <input

                    class="
                        team-input
                        w-full
                        bg-slate-900
                        p-4
                        rounded-2xl
                        border
                        border-slate-700
                        text-sm
                        mb-2
                        font-bold
                    "

                    placeholder="Team ${i} Name"
                >
            `;
        }

        document.getElementById('setupStep1')
            .classList.add('hidden');

        document.getElementById('setupStep2')
            .classList.remove('hidden');
    }


    // =========================
    // SAVE TOURNAMENT
    // =========================

    function saveTournamentConfig() {

        const inputs =
            document.querySelectorAll('.team-input');

        state.tournamentTeams =
            Array.from(inputs).map(i =>
                i.value ||
                `Team ${Math.floor(Math.random()*100)}`
            );

        state.maxOvers =
            parseInt(
                document.getElementById('setupOvers').value
            ) || 5;

        // CREATE POINTS

        state.tournamentTeams.forEach(team => {

            state.points[team] = {

                w: 0,

                l: 0,

                p: 0
            };
        });

        document.getElementById('setupOverlay')
            .classList.add('hidden');

        showMatchSelector();

        syncToCloud();
    }


    // =========================
    // SHOW MATCH SELECTOR
    // =========================

    function showMatchSelector() {

        const batSel =
            document.getElementById('selectBatTeam');

        const bowlSel =
            document.getElementById('selectBowlTeam');

        batSel.innerHTML = '';

        bowlSel.innerHTML = '';

        state.tournamentTeams.forEach(team => {

            batSel.innerHTML += `
                <option value="${team}">
                    ${team}
                </option>
            `;

            bowlSel.innerHTML += `
                <option value="${team}">
                    ${team}
                </option>
            `;
        });

        document.getElementById('matchSelector')
            .classList.remove('hidden');
    }


    // =========================
    // START MATCH
    // =========================

    function startSpecificMatch() {

        state.batTeam =
            document.getElementById('selectBatTeam').value;

        state.bowlTeam =
            document.getElementById('selectBowlTeam').value;

        if(state.batTeam === state.bowlTeam) {

            return alert("Select different teams");
        }

        state.curBat = state.batTeam;

        state.curInn = 1;

        state.matchEnded = false;

        activeAdminTeam = state.batTeam;

        document.getElementById('matchSelector')
            .classList.add('hidden');

        document.getElementById('waitingState')
            .classList.add('hidden');

        document.getElementById('mainDashboard')
            .classList.remove('hidden');

        document.getElementById('scorerPanel')
            .classList.remove('hidden');

        render();

        syncToCloud();
    }
// =========================
    // SAVE UNDO
    // =========================

    function saveUndo() {

        history.push(
            JSON.parse(JSON.stringify(state))
        );
    }


    // =========================
    // UNDO
    // =========================

    function undo() {

        if(history.length === 0) return;

        state = history.pop();

        render();

        syncToCloud();
    }


    // =========================
    // SWAP STRIKE
    // =========================

    function swap() {

        let temp = state.sIdx;

        state.sIdx = state.nsIdx;

        state.nsIdx = temp;
    }


    // =========================
    // NORMAL RUNS
    // =========================

    function handleRun(r) {

        if(
            state.sIdx === null ||
            state.nsIdx === null ||
            state.bIdx === null
        ) {

            return alert(
                "Assign Striker, Non-Striker & Bowler"
            );
        }

        saveUndo();

        // SCORE

        state.runs += r;

        state.balls++;

        // BATSMAN

        state.players[state.sIdx].r += r;

        state.players[state.sIdx].b++;

        // BOWLER

        state.players[state.bIdx].rc += r;

        state.players[state.bIdx].bb++;

        // OVER TRACKER

        state.overBalls.push(r);

        // STRIKE CHANGE

        if(r % 2 !== 0) {

            swap();
        }

        // OVER COMPLETE

        if(state.balls % 6 === 0) {

            state.isOverWaiting = true;

            swap();

            state.overBalls = [];
        }

        render();

        syncToCloud();
    }


    // =========================
    // WICKET
    // =========================

    function handleWicket() {

        if(state.sIdx === null) return;

        saveUndo();

        state.wickers++;

        state.balls++;

        // BOWLER

        state.players[state.bIdx].w++;

        state.players[state.bIdx].bb++;

        // FALL OF WICKET

        state.fallOfWickets.push(

            `${state.runs}/${state.wickers}

            (${state.players[state.sIdx].name},

            ${Math.floor(state.balls/6)}.${state.balls%6})`
        );

        // OVER BALL

        state.overBalls.push('W');

        // PLAYER OUT

        state.players[state.sIdx].isOut = true;

        state.sIdx = null;

        // OVER COMPLETE

        if(state.balls % 6 === 0) {

            state.isOverWaiting = true;

            swap();

            state.overBalls = [];
        }

        render();

        syncToCloud();
    }


    // =========================
    // WIDE BALL
    // =========================

    function handleWide() {

        if(state.bIdx === null) return;

        saveUndo();

        state.runs += 1;

        state.players[state.bIdx].rc += 1;

        // NO BALL COUNT

        state.overBalls.push('WD');

        render();

        syncToCloud();
    }


    // =========================
    // NO BALL
    // =========================

    fnctioun handleNoBall(r) {

        if(
            state.sIdx === null ||
            state.bIdx === null
        ) return;

        saveUndo();

        // 1 EXTRA + RUN

        state.runs += (1 + r);

        // BATTER RUN

        state.players[statfunction handleNoBallPrompt() {

    if(
        state.sIdx === null ||
        state.bIdx === null
    ) return;

    let extraRuns = parseInt(

        prompt(
            "Extra runs scored?\n\nExample:\n0\n1\n2\n3\n4\n6"
        )

    );

    if(isNaN(extraRuns)) return;

    saveUndo();

    // SCORE

    state.runs += (1 + extraRuns);

    // BATTER RUNS

    state.players[state.sIdx].r += extraRuns;

    // BOWLER RUNS

    state.players[state.bIdx].rc += (1 + extraRuns);

    // OVER TRACKER

    state.overBalls.push(`NB+${extraRuns}`);

    render();

    syncToCloud();
}

    // =========================
    // RUN OUT
    // =========================

function handleRunOutPrompt() {

    if(
        state.sIdx === null ||
        state.nsIdx === null
    ) return;

    // RUNS

    let runs = parseInt(

        prompt(
            "How many runs completed?\n\n0\n1\n2\n3"
        )

    );

    if(isNaN(runs)) return;

    // WHO OUT

    let outType = prompt(

        "Who got out?\n\nType:\nS = Striker\nNS = Non-Striker"

    );

    if(
        outType !== 'S' &&
        outType !== 'NS'
    ) return;

    saveUndo();

    // SCORE

    state.runs += runs;

    state.balls++;

    // BATTER RUNS

    state.players[state.sIdx].r += runs;

    state.players[state.sIdx].b++;

    // BALL TO BOWLER

    state.players[state.bIdx].bb++;

    // WICKET

    state.wickers++;

    let outIndex;

    // WHO OUT

    if(outType === 'S') {

        outIndex = state.sIdx;

        state.players[state.sIdx].isOut = true;

    }

    else {

        outIndex = state.nsIdx;

        state.players[state.nsIdx].isOut = true;
    }

    // FALL OF WICKET

    state.fallOfWickets.push(

        `${state.runs}/${state.wickers}

        (${state.players[outIndex].name},

        ${Math.floor(state.balls/6)}.${state.balls%6})`
    );

    // OVER TRACKER

    state.overBalls.push(`${runs}+RO`);

    // STRIKE CHANGE

    if(runs % 2 !== 0) {

        swap();
    }

    // REMOVE PLAYER

    if(outType === 'S') {

        state.sIdx = null;
    }

    else {

        state.nsIdx = null;
    }

    // OVER COMPLETE

    if(state.balls % 6 === 0) {

        state.isOverWaiting = true;

        swap();

        state.overBalls = [];
    }

    render();

    syncToCloud();
}

// =========================
    // CHECK MATCH LOGIC
    // =========================

    function checkLogic() {

        if(state.matchEnded) return;

        // OVERS FINISHED

        const oversDone =

            state.balls >=
            (state.maxOvers * 6);

        // ALL OUT

        const allOut =

            state.wickers >= 10 ||

            state.players.filter(

                p =>
                    p.team === state.curBat &&
                    !p.isOut

            ).length < 1;


        // =====================
        // SECOND INNINGS
        // =====================

        if(state.curInn === 2) {

            // CHASE COMPLETE

            if(state.runs >= state.target) {

                finish(

                    state.curBat,

                    state.curBat === state.batTeam
                        ? state.bowlTeam
                        : state.batTeam
                );
            }

            // LOST MATCH

            else if(oversDone || allOut) {

                finish(

                    state.curBat === state.batTeam
                        ? state.bowlTeam
                        : state.batTeam,

                    state.curBat
                );
            }
        }

        // =====================
        // FIRST INNINGS END
        // =====================

        else if(oversDone || allOut) {

            // TARGET

            state.target = state.runs + 1;

            // SECOND INNINGS

            state.curInn = 2;

            state.curBat = state.bowlTeam;

            // RESET MATCH SCORE

            state.runs = 0;

            state.wickers = 0;

            state.balls = 0;

            // RESET SELECTED PLAYERS

            state.sIdx = null;

            state.nsIdx = null;

            state.bIdx = null;

            // RESET OVER

            state.overBalls = [];

            state.isOverWaiting = false;

            // RESET BATSMEN FOR 2ND INNINGS

            state.players.forEach(player => {

                if(player.team === state.curBat) {

                    player.r = 0;

                    player.b = 0;

                    player.isOut = false;
                }
            });

            alert(`Target: ${state.target}`);

            render();

            syncToCloud();
        }
    }


    // =========================
    // FINISH MATCH
    // =========================

    function finish(winner, loser) {

        state.matchEnded = true;

        // UPDATE POINTS

        state.points[winner].w++;

        state.points[winner].p++;

        state.points[loser].l++;

        render();

        syncToCloud();

        alert(`Winner: ${winner}`);

        togglePoints();
    }
// =========================
    // ADD PLAYER
    // =========================

    function addP() {

        const name =
            document.getElementById('newP').value;

        if(!name) return;

        state.players.push({

            name: name,

            team: activeAdminTeam,

            // BATTING

            r: 0,

            b: 0,

            isOut: false,

            // BOWLING

            w: 0,

            rc: 0,

            bb: 0
        });

        document.getElementById('newP').value = '';

        render();

        syncToCloud();
    }


    // =========================
    // SET PLAYER ROLE
    // =========================

   function setField(index, role) {

    if(role === 'S') {

        state.sIdx = index;
    }

    else if(role === 'NS') {

        state.nsIdx = index;
    }

    else if(role === 'B') {

        state.bIdx = index;

        // ✅ OVER COMPLETE FIX

        state.isOverWaiting = false;
    }

    render();

    syncToCloud();
}


    // =========================
    // SWITCH TEAM TAB
    // =========================

    function switchAdminTeam(teamNo) {

        if(teamNo === 1) {

            activeAdminTeam = state.batTeam;
        }

        else {

            activeAdminTeam = state.bowlTeam;
        }

        renderAdminList();
    }


    // =========================
    // RESET MATCH ONLY
    // =========================

    function resetMatchOnly() {

        // MATCH RESET

        state.runs = 0;

        state.wickers = 0;

        state.balls = 0;

        state.curInn = 1;

        state.target = null;

        state.matchEnded = false;

        state.overBalls = [];

        state.fallOfWickets = [];

        // REMOVE PLAYER SELECTION

        state.sIdx = null;

        state.nsIdx = null;

        state.bIdx = null;

        // RESET PLAYER STATS

        state.players.forEach(player => {

            player.r = 0;

            player.b = 0;

            player.w = 0;

            player.rc = 0;

            player.bb = 0;

            player.isOut = false;
        });

        // BACK TO MATCH SELECTOR

        state.batTeam = '';

        state.bowlTeam = '';

        state.curBat = '';

        document.getElementById('mainDashboard')
            .classList.add('hidden');

        showMatchSelector();

        syncToCloud();
    }


    // =========================
    // FULL RESET
    // =========================

    function fullSystemReset() {

        if(!confirm("Delete everything?")) return;

        // RESET COMPLETE STATE

        state = {

            maxOvers: 5,

            runs: 0,

            wickers: 0,

            balls: 0,

            players: [],

            sIdx: null,

            nsIdx: null,

            bIdx: null,

            batTeam: '',

            bowlTeam: '',

            curBat: '',

            curInn: 1,

            target: null,

            isOverWaiting: false,

            matchEnded: false,

            tournamentTeams: [],

            points: {},

            overBalls: [],

            fallOfWickets: []
        };

        history = [];

        document.getElementById('mainDashboard')
            .classList.add('hidden');

        document.getElementById('waitingState')
            .classList.remove('hidden');

        document.getElementById('setupOverlay')
            .classList.remove('hidden');

        syncToCloud();
    }

// =========================
    // UPDATE HUD
    // =========================

    function updateHUD(nameId, statId, index) {

        if(index === null || !state.players[index]) {

            document.getElementById(nameId)
                .innerText = "---";

            document.getElementById(statId)
                .innerText = "0(0)";

            return;
        }

        const player = state.players[index];

        document.getElementById(nameId)
            .innerText = player.name;

        document.getElementById(statId)
            .innerText =
            `${player.r}(${player.b})`;
    }


    // =========================
    // MAIN RENDER
    // =========================

    function render() {

        // SCORE

        document.getElementById('dispScore')
            .innerText =
            `${state.runs}/${state.wickers}`;

        // OVERS

        document.getElementById('dispOvers')
            .innerText =
            `${Math.floor(state.balls/6)}.${state.balls%6}`;

        // MAX OVERS

        document.getElementById('limitOvers')
            .innerText = state.maxOvers;

        // TEAM

        document.getElementById('batTeamDisp')
            .innerText = state.curBat;

        // INNINGS TAG

        document.getElementById('innTag')
            .innerText =
            `Innings ${state.curInn}`;

        // SHOW DASHBOARD

        document.getElementById('mainDashboard')
            .classList.remove('hidden');

        document.getElementById('waitingState')
            .classList.add('hidden');

        // LOCK BUTTONS AFTER OVER

        const lock =

            state.balls > 0 &&

            state.balls % 6 === 0 &&

            state.isOverWaiting;

        document.getElementById('btnGrid')
            .style.opacity = lock ? "0.3" : "1";

        document.getElementById('btnGrid')
            .style.pointerEvents =
            lock ? "none" : "auto";

        // TARGET

        if(state.curInn === 2) {

            document.getElementById('targetBox')
                .classList.remove('hidden');

            document.getElementById('targetVal')
                .innerText = state.target;

        } else {

            document.getElementById('targetBox')
                .classList.add('hidden');
        }

        // PLAYER HUD

        updateHUD(
            'dispSName',
            'dispSStats',
            state.sIdx
        );

        updateHUD(
            'dispNSName',
            'dispNSStats',
            state.nsIdx
        );

        // BOWLER HUD

        if(
            state.bIdx !== null &&
            state.players[state.bIdx]
        ) {

            const bowler =
                state.players[state.bIdx];

            document.getElementById('dispBName')
                .innerText = bowler.name;

            document.getElementById('dispBStats')
                .innerText =

                `${Math.floor(bowler.bb/6)}.${bowler.bb%6}
                 •
                 ${bowler.rc}R
                 •
                 ${bowler.w}W`;
        }

        // OVER TRACKER

        document.getElementById('overTracker')
            .innerHTML =

            state.overBalls.map(ball => `

                <span class="
                    bg-slate-700
                    px-2
                    py-1
                    rounded-full
                    text-[10px]
                    font-black
                ">
                    ${ball}
                </span>

            `).join('');

        // FALL OF WICKETS

        document.getElementById('fowBox')
            .innerText =
            state.fallOfWickets.join(' • ');

        // OTHER RENDERS

        renderAdminList();

        renderStats();

        renderPointsTable();

        // MATCH LOGIC

        if(state.balls > 0) {

            checkLogic();
        }
    }

// =========================
    // RENDER ADMIN PLAYER LIST
    // =========================

    function renderAdminList() {

        const list =
            document.getElementById('adminPList');

        // TAB NAMES

        document.getElementById('adminTab1')
            .innerText =
            state.batTeam || 'Team A';

        document.getElementById('adminTab2')
            .innerText =
            state.bowlTeam || 'Team B';

        list.innerHTML = '';

        // FILTER PLAYERS

        state.players

            .filter(player =>
                player.team === activeAdminTeam
            )

            .forEach(player => {

                const index =
                    state.players.indexOf(player);

                const isBatSide =
                    player.team === state.curBat;

                list.innerHTML += `

                    <div class="
                        flex
                        justify-between
                        items-center
                        bg-slate-800
                        p-2
                        rounded-xl
                        mb-1

                        ${player.isOut ? 'opacity-30' : ''}
                    ">

                        <!-- NAME -->

                        <span class="
                            text-[10px]
                            font-bold
                            uppercase
                        ">

                            ${player.name}

                        </span>

                        <!-- BUTTONS -->

                        <div class="flex gap-1">

                            ${
                                isBatSide &&
                                !player.isOut &&
                                index !== state.sIdx &&
                                index !== state.nsIdx

                                ?

                                `
                                <button
                                    onclick="setField(${index}, 'S')"

                                    class="
                                        text-[8px]
                                        bg-blue-900
                                        p-1
                                        px-2
                                        rounded
                                    ">

                                    STR

                                </button>

                                <button
                                    onclick="setField(${index}, 'NS')"

                                    class="
                                        text-[8px]
                                        bg-slate-700
                                        p-1
                                        px-2
                                        rounded
                                    ">

                                    NON

                                </button>
                                `

                                : ''
                            }

                            ${
                                !isBatSide &&
                                index !== state.bIdx

                                ?

                                `
                                <button
                                    onclick="setField(${index}, 'B')"

                                    class="
                                        text-[8px]
                                        bg-red-900
                                        p-1
                                        px-2
                                        rounded
                                    ">

                                    BOWL

                                </button>
                                `

                                : ''
                            }

                        </div>

                    </div>
                `;
            });
    }

// =========================
    // RENDER SCORECARDS
    // =========================

    function renderStats() {

        const container =
            document.getElementById('statsContent');

        container.innerHTML =

            [state.batTeam, state.bowlTeam]

            .filter(team => team !== '')

            .map(team => {

                // BATTING

                const battingPlayers =

                    state.players.filter(

                        player => player.team === team
                    );

                // BOWLING

                const bowlingPlayers =

                    state.players.filter(

                        player =>

                            player.team !== team &&

                            player.bb > 0
                    );

                return `

                <!-- BATTING CARD -->

                <div class="
                    mb-5
                    bg-slate-800
                    p-5
                    rounded-3xl
                    border
                    border-slate-700
                ">

                    <p class="
                        text-xs
                        font-black
                        text-yellow-500
                        uppercase
                        mb-3
                    ">

                        ${team} Batting

                    </p>

                    <table class="
                        w-full
                        text-[11px]
                    ">

                        <!-- HEAD -->

                        <tr class="
                            border-b
                            border-slate-700
                            text-slate-400
                        ">

                            <th class="
                                text-left
                                py-2
                            ">

                                Batter

                            </th>

                            <th>R</th>

                            <th>B</th>

                            <th>SR</th>

                        </tr>

                        <!-- PLAYERS -->

                        ${battingPlayers.map(player => `

                            <tr class="
                                ${player.isOut
                                    ? 'text-slate-500'
                                    : 'text-white'}
                            ">

                                <td class="py-2">

                                    ${player.name}

                                    ${!player.isOut ? '*' : ''}

                                </td>

                                <td>${player.r}</td>

                                <td>${player.b}</td>

                                <td>

                                    ${
                                        player.b

                                        ?

                                        ((player.r/player.b)*100)
                                        .toFixed(1)

                                        :

                                        '0'
                                    }

                                </td>

                            </tr>

                        `).join('')}

                    </table>

                </div>

                <!-- BOWLING CARD -->

                <div class="
                    mb-5
                    bg-slate-800
                    p-5
                    rounded-3xl
                    border
                    border-slate-700
                ">

                    <p class="
                        text-xs
                        font-black
                        text-blue-400
                        uppercase
                        mb-3
                    ">

                        ${team} Bowling

                    </p>

                    <table class="
                        w-full
                        text-[11px]
                    ">

                        <!-- HEAD -->

                        <tr class="
                            border-b
                            border-slate-700
                            text-slate-400
                        ">

                            <th class="
                                text-left
                                py-2
                            ">

                                Bowler

                            </th>

                            <th>O</th>

                            <th>R</th>

                            <th>W</th>

                            <th>ECO</th>

                        </tr>

                        <!-- BOWLERS -->

                        ${bowlingPlayers.map(player => `

                            <tr>

                                <td class="py-2">

                                    ${player.name}

                                </td>

                                <td>

                                    ${Math.floor(player.bb/6)}
                                    .
                                    ${player.bb%6}

                                </td>

                                <td>

                                    ${player.rc}

                                </td>

                                <td>

                                    ${player.w}

                                </td>

                                <td>

                                    ${
                                        player.bb

                                        ?

                                        (
                                            player.rc /
                                            (player.bb/6)
                                        ).toFixed(2)

                                        :

                                        '0'
                                    }

                                </td>

                            </tr>

                        `).join('')}

                    </table>

                </div>
                `;
            }).join('');
    }
// =========================
    // RENDER POINTS TABLE
    // =========================

    function renderPointsTable() {

        const body =
            document.getElementById('ptsBody');

        body.innerHTML = '';

        // SORT BY POINTS

        const sortedTeams =

            Object.entries(state.points)

            .sort((a, b) => b[1].p - a[1].p);

        // LOOP

        sortedTeams.forEach(team => {

            const name = team[0];

            const data = team[1];

            body.innerHTML += `

                <tr class="
                    border-b
                    border-slate-700/50
                ">

                    <td class="
                        p-3
                        font-bold
                    ">

                        ${name}

                    </td>

                    <td>

                        ${data.w}

                    </td>

                    <td>

                        ${data.l}

                    </td>

                    <td class="
                        p-3
                        text-right
                        font-black
                        text-yellow-500
                    ">

                        ${data.p}

                    </td>

                </tr>
            `;
        });
    }


    // =========================
    // TOGGLE POINTS TABLE
    // =========================

    function togglePoints() {

        document.getElementById('pointsOverlay')
            .classList.toggle('hidden');
    }
